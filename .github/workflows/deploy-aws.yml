name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'eu-west-1'
  ECR_REPOSITORY: studyverce-socket
  ECS_CLUSTER: studyverce
  ECS_SERVICE: studyverce-socket
  CDK_STACK_NAME: StudyverceStack
  # Socket server CORS allowlist — must match the live Amplify web origin.
  CORS_ORIGIN: https://www.studyverce.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      socket: ${{ steps.filter.outputs.socket }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            socket:
              - 'apps/socket-server/**'
              - 'packages/shared/**'
              - 'packages/rate-limit/**'
              - 'apps/socket-server/Dockerfile'
              - 'pnpm-lock.yaml'
            deploy:
              - 'infra/**'
              - 'apps/socket-server/**'
              - 'packages/shared/**'
              - 'packages/rate-limit/**'
              - 'apps/socket-server/Dockerfile'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy-aws.yml'

  build-push-socket:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          if aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "ECR repository ${{ env.ECR_REPOSITORY }} already exists"
          else
            echo "Creating ECR repository ${{ env.ECR_REPOSITORY }}"
            aws ecr create-repository \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --region "${{ env.AWS_REGION }}" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push socket image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/socket-server/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infrastructure:
    needs: [changes, build-push-socket]
    if: |
      always() &&
      (needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.build-push-socket.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "25.8.1"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: |
          if [ ! -f package-lock.json ]; then npm install; else npm ci; fi

      - name: Resolve AWS account ID
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: CDK bootstrap
        working-directory: infra
        run: npx cdk bootstrap "aws://${{ steps.aws-account.outputs.account_id }}/${{ env.AWS_REGION }}"

      - name: Wait for ECS cluster to be idle
        run: |
          cluster_status=$(aws ecs describe-clusters \
            --clusters "${{ env.ECS_CLUSTER }}" \
            --query 'clusters[0].status' \
            --output text 2>/dev/null || echo "missing")
          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "ECS cluster '${{ env.ECS_CLUSTER }}' is '${cluster_status}' — skipping pre-deploy wait"
            exit 0
          fi

          describe=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --output json 2>/dev/null || echo '{}')
          failures=$(echo "$describe" | jq -r '.failures | length')
          status=$(echo "$describe" | jq -r '.services[0].status // "missing"')

          if [ "$failures" != "0" ] || [ "$status" != "ACTIVE" ]; then
            echo "ECS service '${{ env.ECS_SERVICE }}' is '${status}' — skipping pre-deploy wait"
            exit 0
          fi

          echo "Waiting for ${{ env.ECS_SERVICE }} to become stable before CDK deploy..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"

      - name: CDK deploy
        working-directory: infra
        env:
          CORS_ORIGIN: ${{ env.CORS_ORIGIN }}
          SOCKET_IMAGE_TAG: ${{ needs.build-push-socket.outputs.image_tag }}
        run: |
          npx cdk deploy ${{ env.CDK_STACK_NAME }} \
            --require-approval never \
            -c corsOrigin="$CORS_ORIGIN" \
            -c socketImageTag="$SOCKET_IMAGE_TAG"

      - name: Wait for service stability
        run: |
          cluster_status=$(aws ecs describe-clusters \
            --clusters "${{ env.ECS_CLUSTER }}" \
            --query 'clusters[0].status' \
            --output text 2>/dev/null || echo "missing")
          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "ECS cluster '${{ env.ECS_CLUSTER }}' is '${cluster_status}' after CDK deploy — skipping stability wait"
            exit 0
          fi

          describe=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --output json 2>/dev/null || echo '{}')
          failures=$(echo "$describe" | jq -r '.failures | length')
          status=$(echo "$describe" | jq -r '.services[0].status // "missing"')

          if [ "$failures" != "0" ] || [ "$status" != "ACTIVE" ]; then
            echo "ECS service '${{ env.ECS_SERVICE }}' is '${status}' after CDK deploy — skipping stability wait"
            exit 0
          fi

          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
