name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'eu-north-1'
  ECR_REPOSITORY: studyverce-socket
  ECS_CLUSTER: studyverce
  ECS_SERVICE: studyverce-socket
  CDK_STACK_NAME: StudyverceStack
  # Socket server CORS allowlist — must match the live Amplify web origin.
  CORS_ORIGIN: https://www.studyverce.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      socket: ${{ steps.filter.outputs.socket }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            socket:
              - 'apps/socket-server/**'
              - 'packages/shared/**'
              - 'packages/rate-limit/**'
              - 'apps/socket-server/Dockerfile'
              - 'pnpm-lock.yaml'

  deploy-infrastructure:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: |
          if [ ! -f package-lock.json ]; then npm install; else npm ci; fi

      - name: CDK deploy
        working-directory: infra
        env:
          CORS_ORIGIN: ${{ env.CORS_ORIGIN }}
        run: |
          npx cdk deploy ${{ env.CDK_STACK_NAME }} \
            --require-approval never \
            -c corsOrigin="$CORS_ORIGIN"

  deploy-socket:
    needs: [changes, deploy-infrastructure]
    if: |
      always() &&
      (needs.changes.outputs.socket == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push socket image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/socket-server/Dockerfile \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
