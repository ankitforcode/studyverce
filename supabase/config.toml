# A string used to distinguish different Supabase projects on the same host.
project_id = "studyverce"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3001"
# Hosted project (Dashboard / Management API): site_url = https://www.studyverce.com
additional_redirect_urls = [
  "http://localhost:3001/**",
  "https://www.studyverce.com/auth/callback",
  "https://www.studyverce.com/**",
  "https://studyverce.com/auth/callback",
  "https://studyverce.com/**",
  "https://patient-pika-evident.ngrok-free.app/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Required for signup confirmation emails in local Inbucket (http://localhost:54324).
enable_confirmations = true
# Minimum wait between auth emails to the same address (signup, invite, magic link, etc.).
max_frequency = "30s"

[auth.email.template.confirmation]
subject = "Confirm your email — StudyVerce"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your password — StudyVerce"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Sign in to StudyVerce"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "You're invited — StudyVerce"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email — StudyVerce"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "Confirm it's you — StudyVerce"
content_path = "./supabase/templates/reauthentication.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
