# AWS Amplify Hosting — monorepo Next.js app (apps/web).
# In Amplify Console: set AMPLIFY_MONOREPO_APP_ROOT=apps/web when connecting the repo.
#
# StudyVerce uses server actions, API routes, and Supabase SSR — do not use output: "export".
# Set env vars in Amplify Console (Environment variables) before the first deploy.
#
# Do not use `corepack enable` on Amplify — CodeBuild often hits EACCES on corepack temp/cache dirs.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9.12.3
            - |
              if [ -n "${CODEBUILD_SRC_DIR:-}" ] && [ -f "$CODEBUILD_SRC_DIR/pnpm-workspace.yaml" ]; then
                REPO_ROOT="$CODEBUILD_SRC_DIR"
              else
                REPO_ROOT="$PWD"
                while [ ! -f "$REPO_ROOT/pnpm-workspace.yaml" ] && [ "$REPO_ROOT" != "/" ]; do
                  REPO_ROOT="$(dirname "$REPO_ROOT")"
                done
              fi
              if [ ! -f "$REPO_ROOT/pnpm-workspace.yaml" ]; then
                echo "Monorepo root not found. PWD=$PWD CODEBUILD_SRC_DIR=${CODEBUILD_SRC_DIR:-}" >&2
                exit 1
              fi
              echo "Monorepo root: $REPO_ROOT"
              cd "$REPO_ROOT"
              pnpm config set store-dir .pnpm-store
              pnpm install --frozen-lockfile
        build:
          commands:
            - |
              if [ -n "${CODEBUILD_SRC_DIR:-}" ] && [ -f "$CODEBUILD_SRC_DIR/pnpm-workspace.yaml" ]; then
                REPO_ROOT="$CODEBUILD_SRC_DIR"
              else
                REPO_ROOT="$PWD"
                while [ ! -f "$REPO_ROOT/pnpm-workspace.yaml" ] && [ "$REPO_ROOT" != "/" ]; do
                  REPO_ROOT="$(dirname "$REPO_ROOT")"
                done
              fi
              cd "$REPO_ROOT"
              pnpm --filter web build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../.pnpm-store/**/*
          - ../../node_modules/**/*
          - node_modules/**/*
