# AWS Amplify Hosting — monorepo Next.js SSR (apps/web).
# Console: enable monorepo + AMPLIFY_MONOREPO_APP_ROOT=apps/web
# Platform must be "Web" (WEB_COMPUTE), not static — or you get S3 404 on custom domain.
#
# StudyVerce uses server actions, API routes, and Supabase SSR — do not use output: "export".
version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9.12.3
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -e '^NEXT_PUBLIC_' >> apps/web/.env.production || true
            - env | grep -e '^SUPABASE_SERVICE_ROLE_KEY=' >> apps/web/.env.production || true
            - env | grep -e '^REDIS_URL=' >> apps/web/.env.production || true
            - pnpm --filter web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
          - apps/web/.next/cache/**/*
