version: "3.9"

services:
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Public HTTPS tunnel to the Next.js dev server on the host (port 3001).
  # Use the URL for OAuth redirects: NEXT_PUBLIC_APP_URL=https://<subdomain>.ngrok-free.app
  # Inspector UI: http://127.0.0.1:4040
  ngrok:
    image: ngrok/ngrok:latest
    platform: linux/amd64
    # Avoid crash-loop when .env is missing; run `docker compose up -d ngrok` after fixing .env
    restart: "no"
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$NGROK_AUTHTOKEN" ]; then
          echo "NGROK_AUTHTOKEN is missing in repo root .env (not apps/web/.env.local)."
          echo "Copy .env.example to .env and add your token: https://dashboard.ngrok.com/get-started/your-authtoken"
          exit 1
        fi
        if [ -n "$$NGROK_DOMAIN" ]; then
          echo "Starting ngrok on domain $$NGROK_DOMAIN -> host.docker.internal:3001"
          exec ngrok http --domain="$$NGROK_DOMAIN" host.docker.internal:3001 --log=stdout
        fi
        echo "Starting ngrok (random subdomain) -> host.docker.internal:3001"
        exec ngrok http host.docker.internal:3001 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
